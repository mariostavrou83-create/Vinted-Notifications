<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MSJ · Checking saved login</title><link rel="stylesheet" href="{{ url_for('static',filename='msj.css') }}"></head><body><main><section class="auth-card"><span class="eyebrow">YOUR SAVED DASHBOARD LOGIN</span><h1>Connection check paused</h1><p role="status">{{message}}</p>{% if requires_sign_in %}<a class="primary" href="{{login_path}}">Sign in again →</a>{% else %}<p>No dashboard change was made. You can retry without entering your password again.</p><a class="primary" href="{{retry_path}}">Try again →</a>{% endif %}</section></main></body></html>
