<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Finder account selector</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<h1>Connect to Finder</h1>
<p>Open your account menu on Vinted UK to select your buying profile.</p>
<button type="button" id="check">Check this tab</button>
<p id="result" role="status"></p>
<label for="origin">Pilot dashboard address</label>
<input type="url" id="origin" spellcheck="false" placeholder="https://your-finder.example" autocomplete="off">
<p class="hint">Use the dashboard address from your pilot invitation.</p>
<button type="button" id="continue" class="primary">Continue to Finder</button>
</main><script src="profile.js"></script><script src="popup.js"></script></body></html>
