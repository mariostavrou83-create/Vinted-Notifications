name: Finder regression tests

on:
  push:
    branches: [main, codex/vinted-browser-capsolver-supabase-20261008]
  pull_request:

permissions:
  contents: read

concurrency:
  group: finder-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
